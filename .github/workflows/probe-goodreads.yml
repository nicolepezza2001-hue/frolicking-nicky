name: Probe (temporary)
on:
  push:
    branches: ['probe/**']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          mkdir -p out
          curl -sSL "https://sourcebook.stanford.edu/assets/tei/su_shi_ten_years_dead_living.xml" > out/sushi.xml
          curl -sSL "https://sourcebook.stanford.edu/su_shi_ten_years_dead_living/" > out/sushi.html
          curl -sSL "https://sourcebook.stanford.edu/search/?q=Li+Zhiyi" > out/search1.html
          curl -sSL "https://sourcebook.stanford.edu/texts/" > out/texts.html
          ls -la out
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b probe/milton-data3 && git add -f out && git commit -qm "milton data (temporary)" && git push -f origin probe/milton-data3
