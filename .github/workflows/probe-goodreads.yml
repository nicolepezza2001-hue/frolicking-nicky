name: Probe Goodreads notes (temporary)
on:
  push:
    branches: ['probe/**']
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: study/quotes-trim-highlights }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/sync-quotes.mjs && python3 -c "import json,collections;d=json.load(open('tools/quotes.json'))['goodreads'];print(collections.Counter(q['book'] for q in d))"
