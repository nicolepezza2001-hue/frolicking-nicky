name: Probe (temporary)
on:
  push:
    branches: ['probe/**']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          mkdir -p out
          for t in "Il_paradiso_perduto" "Il_paradiso_perduto/Libro_secondo"; do
            curl -sSL "https://it.wikisource.org/w/api.php?action=parse&page=$t&prop=text&format=json" > "out/p-$(echo $t | tr '/' '_').json"
          done
          ls -la out
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b probe/milton-data2 && git add -f out && git commit -qm "milton data (temporary)" && git push -f origin probe/milton-data2
