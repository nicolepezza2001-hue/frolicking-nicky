name: Probe (temporary)
on:
  push:
    branches: ['probe/**']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          mkdir -p out
          for id in 20 26; do curl -sSL "https://www.gutenberg.org/cache/epub/$id/pg$id.txt" > out/pg$id.txt; done
          for q in "Paradiso%20perduto%20Papi" "Paradiso%20perduto%20Milton%20libro%20secondo" "Paradiso%20perduto%20Rolli"; do
            curl -sSL "https://it.wikisource.org/w/api.php?action=query&list=search&srsearch=$q&srlimit=50&format=json" > "out/s-$q.json"
          done
          curl -sSL "https://it.wikisource.org/w/api.php?action=query&list=allpages&apprefix=Il%20Paradiso%20perduto&aplimit=200&format=json" > out/ap1.json
          curl -sSL "https://it.wikisource.org/w/api.php?action=query&list=allpages&apprefix=Paradiso%20perduto&aplimit=200&format=json" > out/ap2.json
          curl -sSL "https://it.wikisource.org/w/api.php?action=query&list=allpages&apprefix=Il%20paradiso%20perduto&aplimit=200&format=json" > out/ap3.json
          ls -la out
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b probe/milton-data && git add -f out && git commit -qm "milton data (temporary)" && git push -f origin probe/milton-data
