# Every morning, copies Nicky's Goodreads and Notion quotes into tools/quotes.json and rebuilds the study's Quotes shelf (tools/sync-quotes.mjs)
# for the Quotes page of the study. If anything changed it commits the file to main and starts the site deploy
# (pushes made by this workflow don't start other workflows by themselves).
# Notion needs the NOTION_TOKEN repository secret; it is never stored in the repo.
name: Sync quotes

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-quotes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Copy the quotes
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GOODREADS_USER: ${{ vars.GOODREADS_USER }}
        run: node tools/sync-quotes.mjs
      - name: Publish if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet -- tools/quotes.json dist && { echo "Quotes unchanged"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/quotes.json dist
          git commit -m "Sync quotes from Goodreads and Notion"
          git push
          gh workflow run deploy-pages.yml --ref main
