# Checks the site, then publishes the dist/ folder to GitHub Pages whenever main is updated.
# The checks (tools/check-site.mjs and tools/smoke.mjs) also run on every pull request.
# If any check fails, nothing is published and the live site stays as it was.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  check:
    # Pinned: Playwright's browser install doesn't support Ubuntu 26 (ubuntu-latest from Oct 2026) yet.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check links, Italian twins, scripts, photos and file versions
        run: node tools/check-site.mjs
      - name: Install the browser for the phone and desktop test
        working-directory: tools
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Open every page as an iPhone and as a desktop browser
        working-directory: tools
        run: node smoke.mjs

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Upload dist folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # GitHub sometimes can't see the just-uploaded artifact yet ("No artifacts named github-pages"),
      # so wait a moment first and try once more if the first attempt fails.
      - name: Give GitHub a moment to register the upload
        run: sleep 15
      - name: Deploy
        id: deployment_try
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before retrying
        if: steps.deployment_try.outcome == 'failure'
        run: sleep 45
      - name: Deploy (retry)
        id: deployment_retry
        if: steps.deployment_try.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - name: Note the address
        id: deployment
        run: echo "page_url=${{ steps.deployment_try.outputs.page_url || steps.deployment_retry.outputs.page_url }}" >> "$GITHUB_OUTPUT"
